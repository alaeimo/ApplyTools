<!DOCTYPE html>
<html lang="en">
<head>
  <title>Jobs</title>
  <script type="application/ld+json">

    "@type": "ItemList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "item": {
          "@type": "JobPosting",

          "hiringOrganization": {
            "@type": "Organization",
            "name": "ETH Zurich"
          },
          "datePosted": "2025-09-15",

            "@type": "Place",

              "@type": "PostalAddress",

            }
          }

      },
      {
        "@type": "ListItem",
        "position": 2,
        "item": {
          "@type": "JobPosting",
          "title": "PhD in Computational Biology",

          "hiringOrganization": {"@type": "Organization", "name": "EMBL Heidelberg"},

        }
      }
    ]
  }

</head>
<body>
  <main>
    <div class="job-card"><a href="/jobs/qc-1">PhD Position in Quantum Computing</a></div>

  </main>
</body>
</html>
