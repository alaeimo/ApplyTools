<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ApplyTools Connector</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { width: 340px; margin: 0; padding: 16px; background: #f8fafc; color: #0f172a; }
        .header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .header h1 { font-size: 1.1rem; margin: 0; font-weight: 700; }
        .header i { color: #4F46E5; font-size: 1.2rem; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; margin-left: auto; }
        .status-dot.connected { background: #10B981; }
        .status-dot.disconnected { background: #F43F5E; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: #334155; }
        input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem; font-family: monospace; }
        input:focus { outline: none; border-color: #4F46E5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
        .btn { display: inline-block; padding: 7px 14px; border: none; border-radius: 6px; font-size: 0.8rem; font-weight: 500; cursor: pointer; }
        .btn-primary { background: #4F46E5; color: white; }
        .btn-primary:hover { background: #4338CA; }
        .btn-secondary { background: #e2e8f0; color: #334155; }
        .btn-danger { background: #F43F5E; color: white; }
        .actions { display: flex; gap: 8px; margin-top: 12px; }
        .message { font-size: 0.78rem; padding: 8px 10px; border-radius: 6px; margin-top: 10px; display: none; }
        .message.success { display: block; background: #d1fae5; color: #065f46; }
        .message.error { display: block; background: #ffe4e6; color: #9f1239; }
        .info { font-size: 0.75rem; color: #64748B; margin-top: 12px; padding-top: 12px; border-top: 1px solid #e2e8f0; }
        .info a { color: #4F46E5; text-decoration: none; }
        .info a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="header">
        <i class="fas fa-puzzle-piece"></i>
        <h1>ApplyTools</h1>
        <span class="status-dot disconnected" id="statusDot"></span>
    </div>

    <div class="form-group">
        <label for="apiBase">ApplyTools URL</label>
        <input type="url" id="apiBase" value="http://localhost:8000" placeholder="http://localhost:8000">
    </div>

    <div class="form-group">
        <label for="tokenInput">Extension Token</label>
        <input type="text" id="tokenInput" placeholder="ext-xxxxxxxxxxxxx">
    </div>

    <div class="actions">
        <button class="btn btn-primary" id="saveBtn">Save & Test</button>
        <button class="btn btn-danger" id="clearBtn" style="display:none;">Clear</button>
    </div>

    <div class="message" id="messageBox"></div>

    <div class="info">
        Don't have a token? Open your ApplyTools dashboard and click "Extension Token".
        <br><br>
        <a href="#" id="testLink">Test connection</a>
    </div>

    <script src="popup.js"></script>
</body>
</html>
